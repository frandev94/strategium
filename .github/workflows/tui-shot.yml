name: tui-shot

on:
  pull_request:
    paths:
      - extensions/**
      - tools/tui-shot/**
      - package.json
      - bun.lock
      - .github/workflows/tui-shot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tui-shot:
    # Real omp under ConPTY plus headless Edge, no model calls; omp is the devDependency pin.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OMP: '${{ github.workspace }}\node_modules\.bin\omp.exe'
      OUT: '${{ runner.temp }}\tui-shot'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Replays
        shell: bash
        run: python tools/tui-shot/shot.py --all --no-png --omp="$OMP" --out="$OUT" 2>&1 | tee "$RUNNER_TEMP/tui-shot.log"
      - name: PNGs of the failing scenarios
        if: failure()
        shell: bash
        run: |
          grep -oP '^FAIL \K\S+' "$RUNNER_TEMP/tui-shot.log" | while read -r n; do
            python tools/tui-shot/shot.py --replay="$n" --omp="$OMP" --out="$OUT" || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tui-shot
          path: |
            ${{ runner.temp }}\tui-shot
            ${{ runner.temp }}\tui-shot.log
          if-no-files-found: warn
