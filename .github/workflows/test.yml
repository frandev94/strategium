name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Path and case handling differ by OS (the slice checks fold case off Linux), so run both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - if: matrix.os == 'ubuntu-latest'
        run: bun install --frozen-lockfile && bun run check
      - run: bun test
